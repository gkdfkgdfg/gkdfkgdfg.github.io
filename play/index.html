      * {
        margin: 0;

        box-sizing: border-box;

      html, body {
        /* Game screen: nothing here is selectable text. Without these, an
           iOS long-press (racing the JS touch handlers, or starting before
           they attach) selects HUD elements — the joystick gets the blue
           selection box + drag handle mid-game. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        /* On the ROOT on purpose: body-only overscroll-behavior stopped
           propagating to the viewport in modern engines, so pull-to-refresh
           and edge rubber-banding would survive it. */
        overscroll-behavior: none;
      }
      /* Text fields must stay selectable on iOS or the caret/paste UI
         breaks (promo code, profile name, wallet amount/address inputs all
         mount over the game). `code` covers the deposit-address displays,
         whose copy-button fallback is manual selection — restoring the
         callout keeps their long-press menu alive. The `i` flag: HTML
         treats contenteditable="FALSE" as false; CSS attribute matching is
         case-sensitive without it. */
      input, textarea, code, [contenteditable]:not([contenteditable="false" i]) {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
